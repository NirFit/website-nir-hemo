name: Measurement tests

on:
  pull_request:
  push:
    branches: ["main", "cursor/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stage 1 measurement tests
        run: node --test tests/measurement.test.js
